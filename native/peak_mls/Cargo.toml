[package]
name = "peak_mls"
version = "0.1.0"
edition = "2021"
publish = false
description = "Peak's MLS (RFC 9420) layer: OpenMLS behind a small C ABI for dart:ffi"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_basic_credential = "0.6"
openmls_traits = "0.6"
openmls_memory_storage = "0.6"
tls_codec = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

